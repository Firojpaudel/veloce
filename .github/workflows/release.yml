name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = the binary runs on more Linux distros
            asset_name: veloce-linux-x86_64
          - os: windows-latest
            asset_name: veloce-windows-x64.exe
          - os: macos-latest        # Apple Silicon runner
            asset_name: veloce-macos-arm64
          - os: macos-15-intel      # Intel runner (macos-13 was retired and queues forever)
            asset_name: veloce-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      # A recent Python keeps the bundled yt-dlp able to self-update for years
      # (yt-dlp raises its minimum Python version over time).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name veloce \
            --add-data "engine/ui:engine/ui" \
            --hidden-import pystray._xorg --hidden-import pystray._darwin --hidden-import pystray._appindicator \
            --exclude-module tkinter \
            main.py
          cp dist/veloce "dist/${{ matrix.asset_name }}"

      - name: Build (Windows, no console window)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name veloce `
            --icon assets/veloce.ico `
            --add-data "engine/ui;engine/ui" `
            --hidden-import pystray._win32 `
            --exclude-module tkinter `
            main.py
          Copy-Item dist\veloce.exe "dist\${{ matrix.asset_name }}"

      # Optional Authenticode signing. Removes the SmartScreen "unknown publisher" warning.
      # Add WINDOWS_CERT_PFX (base64 .pfx) and WINDOWS_CERT_PASSWORD as repository secrets to enable.
      # Free certificates for open-source projects: https://signpath.org
      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\${{ matrix.asset_name }}"
          Remove-Item cert.pfx

      - name: Smoke test the binary
        shell: bash
        run: |
          "dist/${{ matrix.asset_name }}" --help
          "dist/${{ matrix.asset_name }}" autostart status

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Package browser extension
        run: |
          python3 scripts/package_extension.py
          mkdir -p release_assets
          cp dist/veloce-extension.zip release_assets/

      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Checksums
        run: cd release_assets && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
