name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = the binary runs on more Linux distros
            asset_name: veloce-linux-x86_64
          - os: windows-latest
            asset_name: veloce-windows-x64      # installer + portable zip, see the Windows steps
          - os: macos-latest        # Apple Silicon runner
            asset_name: veloce-macos-arm64
          - os: macos-15-intel      # Intel runner (macos-13 was retired and queues forever)
            asset_name: veloce-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      # A recent Python keeps the bundled yt-dlp able to self-update for years
      # (yt-dlp raises its minimum Python version over time).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name veloce \
            --add-data "engine/ui:engine/ui" \
            --add-data "extension:extension" \
            --collect-data yt_dlp_ejs --collect-all curl_cffi \
            --hidden-import pystray._xorg --hidden-import pystray._darwin --hidden-import pystray._appindicator \
            --exclude-module tkinter \
            main.py
          cp dist/veloce "dist/${{ matrix.asset_name }}"
          "dist/${{ matrix.asset_name }}" --help
          "dist/${{ matrix.asset_name }}" autostart status

      # Windows ships as a folder build inside an installer, not a single .exe:
      # a one-file build unpacks itself to %TEMP% (and gets virus-scanned) on every launch,
      # which made every video lookup seconds slower. Installed per user: no admin prompt.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onedir --windowed --name Veloce `
            --icon assets/veloce.ico `
            --add-data "engine/ui;engine/ui" `
            --add-data "extension;extension" `
            --collect-data yt_dlp_ejs --collect-all curl_cffi `
            --hidden-import pystray._win32 `
            --exclude-module tkinter `
            main.py
          dist\Veloce\Veloce.exe autostart status

      # ffmpeg (joins video + audio) and Deno (YouTube) ship inside the installer: nothing to download on first run
      - name: Bundle video tools
        if: runner.os == 'Windows'
        run: python scripts/bundle_tools.py dist/Veloce

      # Optional Authenticode signing. Removes the SmartScreen "unknown publisher" warning.
      # Add WINDOWS_CERT_PFX (base64 .pfx) and WINDOWS_CERT_PASSWORD as repository secrets to enable.
      # Free certificates for open-source projects: https://signpath.org
      - name: Sign the app
        if: runner.os == 'Windows' && env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Veloce\Veloce.exe

      - name: Build installer and portable zip
        if: runner.os == 'Windows'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          $version = "${{ github.ref_name }}".TrimStart("v"); if ($version -notmatch '^\d') { $version = "0.0.0" }
          & $iscc installer\veloce.iss "/DAppVersion=$version"
          Compress-Archive -Path dist\Veloce\* -DestinationPath dist\veloce-windows-x64-portable.zip

      - name: Sign the installer
        if: runner.os == 'Windows' && env.CERT != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\veloce-setup-windows-x64.exe
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/veloce-setup-windows-x64.exe
            dist/veloce-windows-x64-portable.zip
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write  # Needed for Sigstore Cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Package browser extension
        run: |
          python3 scripts/package_extension.py
          mkdir -p release_assets
          cp dist/veloce-extension.zip release_assets/

      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Checksums
        run: cd release_assets && sha256sum * > SHA256SUMS.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign release assets with Sigstore Cosign (keyless OIDC)
        run: |
          cd release_assets
          for file in *; do
            if [ -f "$file" ]; then
              cosign sign-blob --yes \
                --output-signature "${file}.sig" \
                --output-certificate "${file}.pem" \
                --bundle "${file}.bundle" \
                "$file"
            fi
          done

      # Fast mirror (Hugging Face CDN) — runs only when you've added your own HF_TOKEN secret
      - name: Upload to the fast download mirror
        if: env.HF_TOKEN != ''
        continue-on-error: true   # a mirror problem never blocks the GitHub release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/mirror_upload.py "${{ github.ref_name }}" release_assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true

  # Opens the winget update pull request for each new version (free; no code-signing needed).
  # Turn on after the first version is accepted into microsoft/winget-pkgs:
  #   1. fork https://github.com/microsoft/winget-pkgs to your account
  #   2. create a classic token with the "public_repo" scope and save it as the WINGET_TOKEN secret
  winget:
    name: Submit to winget
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Open winget pull request
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Firojpaudel.Veloce
          installers-regex: 'veloce-setup-windows-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
