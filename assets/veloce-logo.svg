<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="left-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="right-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35" />

  <!-- Left Aerodynamic Wing -->
  <polygon points="120,140 216,140 256,380 168,380" fill="url(#left-wing)" filter="url(#glow)" />

  <!-- Right Kinetic Wing -->
  <polygon points="392,140 296,140 230,380 324,380" fill="url(#right-wing)" filter="url(#glow)" />

  <!-- Apex Core Highlight -->
  <polygon points="236,140 276,140 256,236" fill="#ffffff" opacity="0.95" />
</svg>
