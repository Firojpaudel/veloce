<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veloce</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-name">Veloce</span>
          <div class="status-indicator" id="engine-status">
            <span class="status-dot online"></span>
            <span class="status-text">Ready</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <label class="toggle-control" title="Toggle download interception">
          <span class="toggle-text">Intercept</span>
          <input type="checkbox" id="intercept-toggle" checked>
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
        </label>
      </div>
    </header>

    <!-- URL Input -->
    <div class="input-card">
      <div class="input-field">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <input type="text" id="url-input" placeholder="Paste download URL or media link..." spellcheck="false" autocomplete="off" />
        <button class="btn-icon" id="btn-paste" title="Paste from clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
      <button class="btn-primary" id="btn-add">Download</button>
    </div>

    <!-- Active Transfers / Queue -->
    <div class="section-head">
      <span class="section-label">Active Transfers</span>
      <div class="section-actions">
        <button class="btn-link" id="btn-clear-done">Clear Completed</button>
        <button class="btn-icon-small" id="btn-open-folder" title="Open Downloads Folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button class="btn-icon-small" id="btn-refresh" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="tasks-list" id="tasks-list">
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <div class="empty-title">No Active Transfers</div>
        <div class="empty-sub">Downloads and media captures will appear here</div>
      </div>
    </div>

    <!-- Footer Stats -->
    <footer class="footer">
      <div class="footer-stats">
        <span class="stat-unit" id="speed-meter">Throughput: 0.0 MB/s</span>
      </div>
      <div class="footer-meta">
        <span class="engine-hint" id="engine-mode-hint">Browser Native Mode</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
